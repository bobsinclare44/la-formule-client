    <style>
        /* =========================================
           VARIABLES & RESET
           ========================================= */
        :root {
            --bg: #05051a;
            --text-main: #f1f3ff;
            --text-sec: #9aa4d6;
            --cyan: #4fe3ff;
            --magenta: #ff4fe0;
            --magenta-light: #ff7bf0;
            --card-bg: rgba(7, 9, 30, 0.78);
            --card-border: rgba(130, 150, 255, 0.3);
            --green: #3ddc97;
            --nav-bg: #070a12;
            --nav-border: #1a2233;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: url('IMG_1735.png'); /* Nom réel de ton fichier de fond */

            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: scroll;

            font-family: 'Exo 2', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1, h2, h3, .price, .btn-action {
            font-family: 'Orbitron', sans-serif;
        }

        /* =========================================
           STRUCTURE PRINCIPALE
           ========================================= */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding-bottom: calc(76px + env(safe-area-inset-bottom, 20px) + 16px);
        }

        /* En-tête */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 20px;
            margin-bottom: 12px;
        }

        header img.logo {
            width: 230px;
            height: auto;
            object-fit: contain;
        }

        /* Bouton Info (?) */
        .btn-info {
            position: fixed;
            top: 24px;
            left: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--cyan);
            background: rgba(6, 8, 24, 0.72);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            box-shadow: 0 0 10px rgba(79, 227, 255, 0.2);
            transition: all 0.2s;

        .btn-info.active {

        /* Titre de section */

           CARTES PRODUITS
           ========================================= */
        .product-list {

            flex-direction: column;
            gap: 14px;
            padding: 0 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            overflow: hidden;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .card-img-wrapper {
            width: 100%;

            position: relative;
            background: linear-gradient(135deg, #7d5a22, #34210e);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img-wrapper img {

            background: rgba(6, 8, 24, 0.72=");

            display: flex;

        .product-details {

        .product-details .price {

        }
        .product-details .full-desc {

        /* Modale Vidéo */

        /* Skeleton Loading */
        .skeleton {
            background: #1a2233;
            border-radius: 18px;
            height: 280px;
            position: relative;
            overflow: hidden;
        }
        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
</head>

    <script>
        // =========================================
        // ÉTAT DE L'APPLICATION
        // =========================================
        let products = [];
        let cart = []; 
        
        let currentProduct = null;
        let currentModalQty = 1;
        const qtyStates = {}; 

        // =========================================
        // CHARGEMENT DES DONNÉES
        // =========================================
        async function fetchProducts() {
            try {
                const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/lister_produits`, {
                    method: 'POST',
                    headers: {
                        'apikey': CONFIG.SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        p_mdp: CONFIG.MDP_GENERAL,
                        p_cle: CONFIG.CLE_VIP
                    })
                });
                
                if (!res.ok) throw new Error("Erreur réseau");
                
                const data = await res.json();
                
                if (data && data.length > 0) {
                    products = data;
                } else {
                    throw new Error("Aucun produit");
                }
            } catch (err) {
                console.warn("Mode hors-ligne ou erreur API :", err);
                products = [
                    {
                        id: "1",
                        nom: "Miel du Yémen 250 g",
                        description: "Pot en verre, récolte 2026",
                        prix: 35.00,
                        prix_vip: null,
                        reserve_vip: false,
                        photo_url: "https://images.unsplash.com/photo-1587049352847-8d4e2a6e5e1b?q=80&w=600&auto=format&fit=crop",
                        video_url: null
                    },
                    {
                        id: "2",
                        nom: "Miel du Yémen 500 g",
                        description: "Le grand format, parfait pour les familles.",
                        prix: 62.00,
                        prix_vip: 55.00,
                        reserve_vip: true,
                        photo_url: "https://images.unsplash.com/photo-1587049352847-8d4e2a6e5e1b?q=80&w=600&auto=format&fit=crop",
                        video_url: "https://www.w3schools.com/html/mov_bbb.mp4"
                    }
                ];
            }
            renderProducts();
        }

        // =========================================
        // AFFICHAGE DES PRODUITS
        // =========================================
        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = ''; 

            products.forEach(p => {
                qtyStates[p.id] = 1; 

                const isVip = CONFIG.CLE_VIP && p.prix_vip;
                const displayPrice = isVip ? p.prix_vip : p.prix;

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = (e) => {
                    if(e.target.closest('.card-actions')) return;
                    openProductModal(p);
                };

                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'card-img-wrapper';
                
                if (p.reserve_vip) {
                    const badge = document.createElement('div');
                    badge.className = 'vip-badge';
                    badge.textContent = 'Réservé VIP';
                    imgWrapper.appendChild(badge);
                }

                if (p.photo_url) {
                    const img = document.createElement('img');
                    img.src = p.photo_url;
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    imgWrapper.appendChild(img);
                } else {
                    const ph = document.createElement('div');
                    ph.className = 'img-placeholder';
                    ph.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                    <span>Photo du produit</span>`;
                    imgWrapper.appendChild(ph);
                }

                const content = document.createElement('div');
                content.className = 'card-content';

                const header = document.createElement('div');
                header.className = 'card-header';
                
                const title = document.createElement('h3');
                title.className = 'card-title';
                title.textContent = p.nom; 
                
                const price = document.createElement btn('span');
                price.className = 'price';
               Info price.textContent = `${displayPrice.toFixed(2).replace('..classList', ',')} €`;

                header.appendChild(title.add);
                header.appendChild(price);

                const desc =('active document.createElement('p');
                desc.className = 'card-desc';
                desc.textContent = p.description || ''; 

                const actions = document.createElement('div');
                actions.className = 'card-actions';

                const qtyDiv = document.createElement('div');
                qtyDiv.className = 'qty-selector';
                
                const btnMinus = document.createElement('button');
                btnMinus.className = 'qty-btn';
                btnMinus.textContent = '−';
                btnMinus.onclick = () => { if(qtyStates[p.id] > 1) { qtyStates[p.id]--; updateQtyDisplay(p.id); } };

                const qtyVal = document.createElement('span');
                qtyVal.className = 'qty-val';
                qtyVal.id = `qty-${p.id}`;
                qtyVal.textContent = '1';

                const btnPlus = document.createElement('button');
                btnPlus.className = 'qty-btn';
                btnPlus.textContent = '+';
                btnPlus.onclick = () => { qtyStates[p.id]++; updateQtyDisplay(p.id); };

                qtyDiv.appendChild(btnMinus);
                qtyDiv.appendChild(qtyVal);
                qtyDiv.appendChild(btnPlus);

                const btnAdd = document.createElement('button');
                btnAdd.className = 'btn-add';
                btnAdd.textContent = 'Ajouter au panier';
                btnAdd.onclick = () => addToCart(p.id, qtyStates[p.id]);

                actions.appendChild(qtyDiv);
                actions.appendChild(btnAdd);

                content.appendChild(header);
                content.appendChild(desc);
                content.appendChild(actions);

                card.appendChild(imgWrapper);
                card.appendChild(content);
                container.appendChild(card);
            });
        }

        function updateQtyDisplay(id) {
            document.getElementById(`qty-${id}`).textContent = qtyStates[id];
        }

        // =========================================
        // PANIER
        // =========================================
        function addToCart(id, qty) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += qty;
            } else {
                cart.push({ id, qty });
            }
            updateCartBadge();
        }

        function addToCartFromModal() {
            if (!currentProduct) return;
            addToCart(currentProduct.id, currentModalQty);
            closeProduct();
        }

        function updateCartBadge() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-badge');
            if (total > 0) {
                badge.textContent = total;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // =========================================
        // LOGIQUE MODALE INFOS
        // =========================================
        const btnInfo = document.getElementById('btn-info');
        const modalInfo = document.getElementById('modal-info');
        const overlay = document.getElementById('overlay');

        btnInfo.onclick = () => {
            modalInfo.classList.add('open');
            overlay.classList.add('open');
           ');
            document.body.style.overflow = 'hidden';
        };

        function closeInfos() {
            modalInfo.classList.remove('open');
            overlay.classList.remove('open');
            btnInfo.classList.remove('active');
            document.body.style.overflow = '';
        }

        overlay.onclick = () => {
            closeInfos();
            closeProduct();
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeInfos();
                closeProduct();
                closeVideo();
            }
        });

        // =========================================
        // LOGIQUE FICHE PRODUIT
        // =========================================
        const modalProduct = document.getElementById('modal-product');
        
        function openProductModal(p) {
            currentProduct = p;
            currentModalQty = 1;
            
            const isVip = CONFIG.CLE_VIP && p.prix_vip;
            const displayPrice = isVip ? p.prix_vip : p.prix;

            document.getElementById('product-title').textContent = p.nom;
            document.getElementById('product-price').textContent = `${displayPrice.toFixed(2).replace('.', ',')} €`;
            document.getElementById('product-desc').textContent = p.description || '';
            document.getElementById('product-qty').textContent = '1';

            const imgWrapper = document.getElementById('product-img-wrapper');
            imgWrapper.innerHTML = '<button class="btn-close" style="position:absolute; top:16px; right:16px; background:rgba(0,0,0,0.5); color:white; border-radius:50%; z-index:10;" onclick="closeProduct()">×</button>';

            if (p.photo_url) {
                const img = document.createElement('img');
                img.src = p.photo_url;
                img.loading = 'lazy';
                img.decoding = 'async';
                imgWrapper.appendChild(img);
            }

            if (p.video_url) {
                const btnPlay = document.createElement('div');
                btnPlay.className = 'btn-play-video';
                btnPlay.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                btnPlay.onclick = () => openVideo(p.video_url);
                imgWrapper.appendChild(btnPlay);
            }

            modalProduct.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeProduct() {
            modalProduct.classList.remove('open');
            if (!modalInfo.classList.contains('open')) {
                overlay.classList.remove('open');
                document.body.style.overflow = '';
            }
        }

        function changeQty(delta) {
            currentModalQty += delta;
            if (currentModalQty < 1) currentModalQty = 1;
            document.getElementById('product-qty').textContent = currentModalQty;
        }

        // =========================================
        // LOGIQUE VIDÉO
        // =========================================
        const modalVideo = document.getElementById('modal-video');
        const videoPlayer = document.getElementById('video-player');

        function openVideo(url) {
            videoPlayer.src = url;
            modalVideo.classList.add('open');
            videoPlayer.play();
        }

        function closeVideo() {
            videoPlayer.pause();
            videoPlayer.src = '';
            modalVideo.classList.remove('open');
        }

        // =========================================
        // INITIALISATION
        // =========================================
        fetchProducts();

    </script>
</body>
</html>
