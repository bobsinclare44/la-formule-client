<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - La Formule</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070a12;
            --cyan: #00f0ff;
            --magenta: #ff2bd6;
            --text: #e0e0e0;
            --card: #111827;
            --border: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Exo 2', sans-serif; padding-bottom: 70px; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }
        
        /* Connexion */
        #login-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        #login-view input { width: 100%; max-width: 300px; padding: 15px; margin: 20px 0; background: var(--card); border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 16px; }
        .btn { background: var(--cyan); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-family: 'Exo 2', sans-serif; font-size: 16px; cursor: pointer; width: 100%; max-width: 300px;}
        
        /* App */
        #app-view { display: none; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        header h1 { color: var(--cyan); font-size: 24px; }
        header button { background: transparent; border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 5px; font-size: 12px; }
        
        /* Onglets */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; }
        .tab.active { border-color: var(--cyan); color: var(--cyan); }
        
        .panel { display: none; }
        .panel.active { display: block; }
        
        /* Listes */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .card-title { font-weight: bold; color: var(--cyan); }
        .card-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .card-actions button, .card-actions select { flex: 1; padding: 8px; border-radius: 5px; border: none; font-size: 12px; }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-toggle { background: var(--magenta); color: white; }
        
        /* VIP */
        .vip-key { font-family: monospace; background: #000; padding: 5px; border-radius: 3px; color: var(--cyan); word-break: break-all; }
        
        /* Nouveau produit */
        #product-form { display: none; background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--cyan); }
        #product-form input[type="text"], #product-form input[type="number"] { width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 5px; }
        #product-form label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text); }
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        
        .error { color: #ef4444; margin-top: 10px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <!-- VUE CONNEXION -->
    <div id="login-view">
        <h1 style="color:var(--cyan); text-shadow: 0 0 10px var(--cyan);">LA FORMULE</h1>
        <p style="margin-top:10px; color: #888;">Panneau admin</p>
        <input type="password" id="pwd" placeholder="Mot de passe admin">
        <button class="btn" onclick="login()">ENTRER</button>
        <p id="login-error" class="error"></p>
    </div>

    <!-- VUE APP -->
    <div id="app-view">
        <header>
            <h1>ADMIN</h1>
            <button onclick="logout()">QUITTER</button>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('produits')">Produits</div>
            <div class="tab" onclick="switchTab('commandes')">Commandes</div>
            <div class="tab" onclick="switchTab('vip')">Clés VIP</div>
        </div>

        <!-- ONGLET PRODUITS -->
        <div id="tab-produits" class="panel active">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h2 style="font-size:18px;">Catalogue</h2>
                <button class="btn" style="width:auto; padding:8px 15px; font-size:14px;" onclick="toggleForm()">+ Nouveau</button>
            </div>
            
            <div id="product-form">
                <h3 style="margin-bottom:10px; font-size:16px;" id="form-title">Nouveau produit</h3>
                <input type="hidden" id="prod-id">
                <input type="text" id="prod-nom" placeholder="Nom du produit">
                <input type="number" id="prod-prix" placeholder="Prix normal (ex: 25.50)" step="0.01">
                <input type="number" id="prod-prix-vip" placeholder="Prix VIP (optionnel)" step="0.01">
                <input type="text" id="prod-photo" placeholder="URL de la photo">
                <input type="text" id="prod-video" placeholder="URL de la vidéo (optionnel)">
                <input type="text" id="prod-desc" placeholder="Description">
                <div class="checkbox-row">
                    <input type="checkbox" id="prod-visible" checked> <label for="prod-visible">Visible</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="prod-vip"> <label for="prod-vip">Réservé VIP</label>
                </div>
                <button class="btn" onclick="saveProduit()" style="max-width:100%;">Enregistrer</button>
                <button class="btn" onclick="toggleForm()" style="max-width:100%; background:transparent; color:#888; border:1px solid #333; margin-top:10px;">Annuler</button>
            </div>

            <div id="liste-produits"></div>
        </div>

        <!-- ONGLET COMMANDES -->
        <div id="tab-commandes" class="panel">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h2 style="font-size:18px;">Tickets</h2>
                <button class="btn" style="width:auto; padding:8px 15px; font-size:14px;" onclick="loadCommandes()">Rafraîchir</button>
            </div>
            <div id="liste-commandes"></div>
        </div>

        <!-- ONGLET CLES VIP -->
        <div id="tab-vip" class="panel">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h2 style="font-size:18px;">Clés VIP</h2>
                <button class="btn" style="width:auto; padding:8px 15px; font-size:14px;" onclick="genererCle()">+ Générer</button>
            </div>
            <div id="nouvelle-cle" style="display:none; background:#1f2937; border:1px solid var(--magenta); padding:15px; border-radius:8px; margin-bottom:15px; text-align:center;">
                <p style="color:#888; font-size:12px; margin-bottom:5px;">Copie cette clé maintenant, elle ne sera plus jamais affichée :</p>
                <div class="vip-key" id="cle-text"></div>
            </div>
            <div id="liste-cles"></div>
        </div>

    </div>

    <script>
        const SB_URL = 'https://xwctaegjcknthjwyyolq.supabase.co';
        const SB_KEY = 'sb_publishable_8orKy9SLqBdGRkvbAhfQeA_xVKujcDl';
        let currentPwd = '';

        // --- CONNEXION ---
        async function login() {
            const pwd = document.getElementById('pwd').value;
            const err = document.getElementById('login-error');
            err.textContent = 'Vérification...';
            
            try {
                const res = await fetch(`${SB_URL}/rest/v1/rpc/verifier_admin`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ p_admin: pwd })
                });
                const data = await res.json();
                
                if (data === true) {
                    currentPwd = pwd;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'block';
                    loadProduits();
                } else {
                    err.textContent = 'Mot de passe incorrect.';
                }
            } catch(e) {
                err.textContent = 'Erreur de connexion.';
            }
        }

        function logout() {
            currentPwd = '';
            document.getElementById('pwd').value = '';
            document.getElementById('app-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'flex';
        }

        // --- NAVIGATION ---
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

            if (tab === 'commandes') loadCommandes();
            if (tab === 'vip') loadCles();
        }

        // --- GESTION PRODUITS ---
        function toggleForm() {
            const form = document.getElementById('product-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
            if (form.style.display === 'block') {
                document.getElementById('prod-id').value = '';
                document.getElementById('prod-nom').value = '';
                document.getElementById('prod-prix').value = '';
                document.getElementById('prod-prix-vip').value = '';
                document.getElementById('prod-photo').value = '';
                document.getElementById('prod-video').value = '';
                document.getElementById('prod-desc').value = '';
                document.getElementById('prod-visible').checked = true;
                document.getElementById('prod-vip').checked = false;
                document.getElementById('form-title').textContent = 'Nouveau produit';
            }
        }

        async function loadProduits() {
            const res = await fetch(`${SB_URL}/rest/v1/rpc/admin_lister_produits`, {
                method: 'POST',
                headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd })
            });
            const produits = await res.json();
            const container = document.getElementById('liste-produits');
            container.innerHTML = '';

            if (produits.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">Aucun produit.</p>';
                return;
            }

            produits.forEach(p => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${p.nom}</span>
                        <span>${p.prix} € ${p.prix_vip ? `/ ${p.prix_vip} € VIP` : ''}</span>
                    </div>
                    <div style="font-size:12px; color:#888; margin-bottom:10px;">
                        ${p.visible ? '🟢 Visible' : '🔴 Masqué'} | ${p.reserve_vip ? '👑 Réservé VIP' : 'Standard'}
                    </div>
                    <div class="card-actions">
                        <button class="btn-edit" onclick='editProduit(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Modifier</button>
                        <button class="btn-toggle" onclick="toggleVisible('${p.id}', ${!p.visible})">${p.visible ? 'Masquer' : 'Afficher'}</button>
                        <button class="btn-delete" onclick="deleteProduit('${p.id}')">Suppr</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function editProduit(p) {
            document.getElementById('form-title').textContent = 'Modifier le produit';
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-nom').value = p.nom;
            document.getElementById('prod-prix').value = p.prix;
            document.getElementById('prod-prix-vip').value = p.prix_vip || '';
            document.getElementById('prod-photo').value = p.photo_url || '';
            document.getElementById('prod-video').value = p.video_url || '';
            document.getElementById('prod-desc').value = p.description || '';
            document.getElementById('prod-visible').checked = p.visible;
            document.getElementById('prod-vip').checked = p.reserve_vip;
            document.getElementById('product-form').style.display = 'block';
            window.scrollTo(0,0);
        }

        async function saveProduit() {
            const id = document.getElementById('prod-id').value;
            const data = {
                id: id || null,
                nom: document.getElementById('prod-nom').value,
                prix: parseFloat(document.getElementById('prod-prix').value),
                prix_vip: document.getElementById('prod-prix-vip').value ? parseFloat(document.getElementById('prod-prix-vip').value) : null,
                photo_url: document.getElementById('prod-photo').value,
                video_url: document.getElementById('prod-video').value,
                description: document.getElementById('prod-desc').value,
                visible: document.getElementById('prod-visible').checked,
                reserve_vip: document.getElementById('prod-vip').checked
            };

            await fetch(`${SB_URL}/rest/v1/rpc/admin_sauver_produit`, {
                method: 'POST',
                headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd, p: data })
            });
            
            toggleForm();
            loadProduits();
        }

        async function toggleVisible(id, visible) {
            const p = { id: id, visible: visible };
            const res = await fetch(`${SB_URL}/rest/v1/rpc/admin_lister_produits`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd })
            });
            const produits = await res.json();
            const prod = produits.find(x => x.id === id);
            
            prod.visible = visible;
            await fetch(`${SB_URL}/rest/v1/rpc/admin_sauver_produit`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd, p: prod })
            });
            loadProduits();
        }

        async function deleteProduit(id) {
            if(!confirm('Supprimer définitivement ce produit ?')) return;
            await fetch(`${SB_URL}/rest/v1/rpc/admin_supprimer_produit`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd, p_id: id })
            });
            loadProduits();
        }

        // --- GESTION COMMANDES ---
        async function loadCommandes() {
            const container = document.getElementById('liste-commandes');
            container.innerHTML = 'Chargement...';
            const res = await fetch(`${SB_URL}/rest/v1/rpc/admin_lister_commandes`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd })
            });
            const commandes = await res.json();
            container.innerHTML = '';

            if (commandes.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">Aucune commande.</p>';
                return;
            }

            const statuts = ['recue', 'validee', 'refusee', 'en_preparation', 'en_route', 'livree', 'abandonnee'];

            commandes.forEach(c => {
                const date = new Date(c.created_at).toLocaleString('fr-FR');
                const div = document.createElement('div');
                div.className = 'card';
                
                let lignesHtml = c.lignes.map(l => `<li>${l.qte}x ${l.nom} - ${l.total_ligne} €</li>`).join('');
                
                let optionsHtml = statuts.map(s => `<option value="${s}" ${c.statut === s ? 'selected' : ''}>${s}</option>`).join('');

                div.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Ticket #${c.numero}</span>
                        <span>${c.total} €</span>
                    </div>
                    <div style="font-size:12px; color:#888; margin-bottom:10px;">${date} ${c.cle_vip_id ? '👑 VIP' : ''}</div>
                    <ul style="font-size:13px; margin-left:20px; margin-bottom:10px;">${lignesHtml}</ul>
                    <div class="card-actions">
                        <select onchange="changerStatut(${c.numero}, this.value)">
                            ${optionsHtml}
                        </select>
                        <button class="btn-delete" onclick="supprimerCommande(${c.numero})">Suppr</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function changerStatut(numero, statut) {
            await fetch(`${SB_URL}/rest/v1/rpc/admin_changer_statut`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd, p_numero: numero, p_statut: statut })
            });
        }

        async function supprimerCommande(numero) {
            if(!confirm('Supprimer définitivement le ticket #' + numero + ' ?')) return;
            await fetch(`${SB_URL}/rest/v1/rpc/admin_supprimer_commande`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd, p_numero: numero })
            });
            loadCommandes();
        }

        // --- GESTION CLES VIP ---
        async function loadCles() {
            const container = document.getElementById('liste-cles');
            container.innerHTML = 'Chargement...';
            const res = await fetch(`${SB_URL}/rest/v1/rpc/admin_lister_cles_vip`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd })
            });
            const cles = await res.json();
            container.innerHTML = '';

            if (cles.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">Aucune clé VIP.</p>';
                return;
            }

            cles.forEach(c => {
                const date = new Date(c.created_at).toLocaleDateString('fr-FR');
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${c.nom_client}</span>
                        <span style="color:${c.active ? 'var(--cyan)' : '#ef4444'}">${c.active ? 'Active' : 'Inactive'}</span>
                    </div>
                    <div style="font-size:12px; color:#888; margin-bottom:10px;">Créée le ${date}</div>
                    <div class="card-actions">
                        <button class="btn-toggle" onclick="toggleCle('${c.id}', ${!c.active})" style="background:${c.active ? '#ef4444' : 'var(--cyan)'}">
                            ${c.active ? 'Désactiver' : 'Activer'}
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function genererCle() {
            const nom = prompt("Nom du client VIP :");
            if (!nom) return;

            const res = await fetch(`${SB_URL}/rest/v1/rpc/admin_generer_cle_vip`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd, p_nom_client: nom })
            });
            const cleClaire = await res.json();
            
            if (cleClaire) {
                document.getElementById('cle-text').textContent = cleClaire;
                document.getElementById('nouvelle-cle').style.display = 'block';
                loadCles();
            }
        }

        async function toggleCle(id, active) {
            await fetch(`${SB_URL}/rest/v1/rpc/admin_toggle_cle_vip`, {
                method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_admin: currentPwd, p_id: id, p_active: active })
            });
            loadCles();
        }
    </script>
</body>
</html>
