<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Test Menu</title>
    <style>
        body { background-color: #05051a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #111; border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        h2 { color: #4fe3ff; }
        p { color: #aaa; }
    </style>
</head>
<body>

    <h1>Test du Menu</h1>
    <div id="product-list">Chargement...</div>

    <script>
        // On force 2 produits en dur
        const testProducts = [
            { nom: "Miel du Yémen 250 g", prix: 35.00, desc: "Pot en verre" },
            { nom: "Miel du Yémen 500 g", prix: 62.00, desc: "Grand format" }
        ];

        const container = document.getElementById('product-list');
        container.innerHTML = ''; // On vide le texte "Chargement..."

        testProducts.forEach(p => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <h2>${p.nom}</h2>
                <p>${p.desc}</p>
                <strong>${p.prix} €</strong>
            `;
            container.appendChild(div);
        });
    </script>
</body>
</html>
